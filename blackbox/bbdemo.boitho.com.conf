<VirtualHost *>


SetEnv BOITHOHOME /home/boitho/boithoTools
# Perl 5.26+ removed "." from @INC; the CGIs (webclient2, webadmin) load sibling
# modules (e.g. index-common.pm, Sql/Config.pm) from their own directory, which
# the cgid server makes the working directory. Restore the legacy behaviour so
# those loads resolve, matching the appliance's older Perl.
SetEnv PERL_USE_UNSAFE_INC 1

DocumentRoot /home/boitho/boithoTools/public_html
ServerName bbdemo.boitho.com
ServerAdmin webmaster@boitho.com
ScriptAlias /cgi-bin/ /home/boitho/boithoTools/cgi-bin/
ErrorLog syslog:local6
CustomLog "|/usr/bin/logger -p local6.info -t apacheaccess" common

<Directory "/home/boitho/boithoTools/cgi-bin">
  AllowOverride all
  Require all granted
</Directory>

<Directory "/home/boitho/boithoTools/public_html">
  AllowOverride all
  Require all granted
</Directory>
        ServerAlias www.bbdemo.boitho.com

<Location "/webclient/index.php">
        AuthName modBoitho
        AuthBoitho on
        AuthType Basic
        require valid-user
</Location>

<Location "/cgi-bin/suggest_webclient">
        AuthName modBoitho
        AuthBoitho on
        AuthType Basic
        require valid-user
</Location>


</VirtualHost>


